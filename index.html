<style>
:root {
  color-scheme: light;
  --paper: #f6f5f1;
  --surface: #fff;
  --ink: #1e2927;
  --quiet: #52615d;
  --line: #d9ded7;
  --accent: #20594d;
  --accent-wash: #e5f0ec;
  --stage: #e8e9e4;
  --radius: 15px;
  font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--paper); }
body:has(dialog[open]) { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button, select { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid #367666; outline-offset: 3px; }
[hidden] { display: none !important; }
.wrap { max-width: 1512px; width: 100%; margin-inline: auto; padding-inline: clamp(16px, 4.2vw, 64px); }
.masthead { padding-block: clamp(34px, 5vw, 75px) 26px; }
.kicker { margin: 0 0 14px; color: var(--accent); font-size: .78rem; font-weight: 730; letter-spacing: .12em; }
h1 { margin: 0; font-size: clamp(2.1rem, 4.3vw, 4rem); line-height: 1.13; font-weight: 720; letter-spacing: -.045em; }
.lead { max-width: 42rem; margin: 15px 0 0; color: var(--quiet); font-size: 1rem; }
.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  margin: clamp(26px, 4vw, 47px) 0 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--line);
}
.stats > div { display: flex; flex-direction: column-reverse; background: var(--surface); padding: clamp(12px, 2.3vw, 24px); }
.stats dt { color: var(--quiet); font-size: .82rem; }
.stats dd { margin: 0; font-size: clamp(1.6rem, 3vw, 2.65rem); line-height: 1.17; font-variant-numeric: tabular-nums; }
.toolbar {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
  gap: 11px;
  padding-block: 12px 18px;
  border-bottom: 1px solid var(--line);
}
.field { display: grid; gap: 6px; color: var(--quiet); font-size: .82rem; font-weight: 650; }
.field input, .field select { width: 100%; min-height: 44px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-size: .92rem; font-weight: 450; }
.field input::placeholder { color: #66746f; }
.category { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chips button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 5px 11px;
  color: var(--ink);
  background: var(--surface);
  font-size: .84rem;
}
.chips button[aria-pressed="true"] { color: #fff; border-color: var(--accent); background: var(--accent); }
.chip-count { font-size: .72rem; font-variant-numeric: tabular-nums; opacity: .8; }
.chips button:hover:not([aria-pressed="true"]) { border-color: var(--accent); background: var(--accent-wash); }
.results { margin: 13px 0 19px; color: var(--quiet); font-size: .86rem; }
.cases { display: grid; gap: 20px; padding-bottom: 70px; }
.case { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); scroll-margin-top: 16px; }
.case:target { border-color: var(--accent); }
.case-head { display: flex; gap: 13px; align-items: baseline; padding: clamp(13px, 2vw, 24px) clamp(12px, 2.1vw, 29px) 12px; }
.case-index { color: var(--accent); font-size: .83rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.case h2 { margin: 0; font-size: clamp(1.12rem, 2vw, 1.65rem); line-height: 1.28; overflow-wrap: anywhere; }
.case-category { margin-left: auto; padding: 3px 9px; border-radius: 15px; color: var(--accent); background: var(--accent-wash); white-space: nowrap; font-size: .76rem; font-weight: 690; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; padding: 0 clamp(12px, 2.1vw, 29px); }
.panel { min-width: 0; }
.panel-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; min-height: 29px; }
.panel h3 { margin: 0; font-size: .88rem; }
.panel-count { color: var(--quiet); font-size: .75rem; }
.panel-note { margin: 7px 0 0; color: var(--quiet); font-size: .78rem; }
.images { display: grid; gap: 9px; }
.images:empty { display: none; }
figure { margin: 0; min-width: 0; }
.photo {
  display: grid;
  place-items: center;
  width: 100%;
  overflow: hidden;
  aspect-ratio: 4 / 3;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--stage);
  cursor: zoom-in;
}
.photo:hover { border-color: var(--accent); }
.photo img { display: block; width: 100%; height: 100%; object-fit: contain; }
.photo[data-panorama="true"] { aspect-ratio: 2 / 1; }
.photo:disabled { cursor: default; color: var(--quiet); }
figure figcaption { min-height: 0; margin-top: 4px; color: var(--quiet); font-size: .75rem; overflow-wrap: anywhere; }
figure figcaption:empty { display: none; }
.empty-image {
  display: grid;
  place-items: center;
  min-height: 122px;
  padding: 15px;
  border: 1px dashed #c6cdc6;
  border-radius: 10px;
  color: var(--quiet);
  background: var(--paper);
  font-size: .84rem;
  text-align: center;
}
.case-foot {
  margin: 17px clamp(12px, 2.1vw, 29px) 0;
  padding: 11px 0 14px;
  border-top: 1px solid var(--line);
}
.case-meta { display: flex; flex-wrap: wrap; gap: 3px 12px; color: var(--quiet); font-size: .75rem; overflow-wrap: anywhere; }
.case-meta span { min-width: 0; }
.case-meta a { text-underline-offset: 3px; }
.case details { margin-top: 9px; font-size: .8rem; color: var(--quiet); }
.case details summary { cursor: pointer; color: var(--accent); font-weight: 650; }
.prompt { margin: 5px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.no-results { padding: 24px; margin: 0 0 42px; border: 1px dashed #c6cdc6; border-radius: var(--radius); color: var(--quiet); }
dialog {
  width: min(1320px, calc(100vw - 24px));
  max-width: none;
  max-height: calc(100dvh - 24px);
  padding: 0;
  border: 1px solid #65756f;
  border-radius: var(--radius);
  color: #f5f7f5;
  background: #1b2421;
}
dialog::backdrop { background: rgb(14 19 17 / .82); }
.viewer-head, .viewer-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 7px 12px; padding: 10px 14px; }
.viewer-head { justify-content: space-between; }
.viewer-head h2 { margin: 0; font-size: .98rem; }
.viewer-stage { display: grid; min-height: 140px; place-items: center; margin: 0; padding: 6px 12px; background: #121917; }
.viewer-stage img { display: block; width: auto; max-width: 100%; max-height: calc(100dvh - 160px); object-fit: contain; }
.viewer-caption { color: #d4ded8; font-size: .82rem; }
.viewer-controls .original { margin-left: auto; color: #cce8db; text-underline-offset: 3px; }
.viewer-button { min-height: 42px; padding: 4px 11px; border: 1px solid #677870; border-radius: 8px; color: inherit; background: #24322d; }
.viewer-button:hover:not(:disabled) { background: #355044; }
.viewer-button:disabled { opacity: .46; cursor: default; }
@media (max-width: 650px) {
  .toolbar { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pair { grid-template-columns: minmax(0, 1fr); }
  .case-head { gap: 8px; }
  .case-category { white-space: normal; flex: 0 0 auto; max-width: 6.5em; }
}
@media print {
  .toolbar, dialog, .results { display: none; }
  .wrap { max-width: none; padding-inline: 0; }
  .case { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="masthead wrap">
  <p class="kicker">AI 灵感 / 素材审查</p>
  <h1>生图案例审查</h1>
  <p class="lead">按任务查看输入图和输出图。点击图片放大，也可单独打开原图。</p>
  <dl class="stats" aria-label="全部案例的图片覆盖">
    <div><dt>案例总数</dt><dd id="stat-total">—</dd></div>
    <div><dt>有输入图的案例</dt><dd id="stat-inputs">—</dd></div>
    <div><dt>有输出图的案例</dt><dd id="stat-outputs">—</dd></div>
    <div><dt>输入和输出都有图</dt><dd id="stat-paired">—</dd></div>
  </dl>
</header>
<main class="wrap">
  <form class="toolbar" aria-label="筛选案例">
    <label class="field"><span>搜索</span><input id="search" type="search" placeholder="输入标题、分类、案例编号或 Task ID" autocomplete="off"></label>
    <label class="field"><span>图片覆盖</span><select id="coverage">
      <option value="any">全部案例</option>
      <option value="paired">输入和输出都有图</option>
      <option value="unpaired">至少一侧没有图</option>
    </select></label>
    <div class="category">
      <ul class="chips" id="categories" aria-label="案例分类"></ul>
    </div>
  </form>
  <p id="results" class="results" role="status"></p>
  <section id="cases" class="cases" aria-label="案例列表"></section>
  <p id="no-results" class="no-results" hidden>没有符合当前筛选条件的案例。</p>
  <noscript><p class="no-results">开启 JavaScript 后即可查看案例列表和图片。</p></noscript>
</main>
<template id="case-template">
  <article class="case">
    <header class="case-head"><span class="case-index"></span><h2></h2><span class="case-category"></span></header>
    <div class="pair"></div>
    <footer class="case-foot"><div class="case-meta"></div></footer>
  </article>
</template>
<template id="panel-template">
  <section class="panel">
    <header class="panel-head"><h3></h3><span class="panel-count"></span></header>
    <div class="images"></div><div class="empty-image" hidden></div>
    <p class="panel-note" hidden></p>
  </section>
</template>
<dialog id="viewer" aria-labelledby="viewer-title">
  <header class="viewer-head">
    <h2 id="viewer-title"></h2>
    <button class="viewer-button" id="viewer-close" type="button" autofocus>关闭</button>
  </header>
  <div class="viewer-stage"><img id="viewer-image" alt=""><p id="viewer-error" hidden>无法打开图片文件。</p></div>
  <footer class="viewer-controls">
    <button class="viewer-button" id="viewer-prev" type="button">上一张</button>
    <button class="viewer-button" id="viewer-next" type="button">下一张</button>
    <span id="viewer-caption" class="viewer-caption" aria-live="polite"></span>
    <a id="viewer-original" class="original" target="_blank" rel="noopener">查看原图 ↗</a>
  </footer>
</dialog>

<script>
"use strict";
const byId = (id) => document.getElementById(id);
const manifestText = byId("case-data").textContent;
const { cases } = JSON.parse(manifestText);
const filters = { category: "", query: "", coverage: "any" };
const categoryCounts = new Map();
const chips = new Map();
const cards = [];
const viewer = byId("viewer");
let viewerState;

function filled(caseItem) {
  return caseItem.inputs.length > 0 && caseItem.outputs.length > 0;
}

function textElement(tag, text) {
  const element = document.createElement(tag);
  element.textContent = text;
  return element;
}

function addChip(category, label, count) {
  const button = textElement("button", label);
  button.type = "button";
  button.setAttribute("aria-pressed", String(!category));
  const total = textElement("span", count);
  total.className = "chip-count";
  button.append(total);
  const listItem = document.createElement("li");
  listItem.append(button);
  byId("categories").append(listItem);
  chips.set(category, button);
  button.addEventListener("click", () => {
    filters.category = category;
    updateFilters();
  });
}

function updateFilters() {
  let shown = 0;
  for (const card of cards) {
    const categoryMatch = !filters.category || card.data.category === filters.category;
    const queryMatch = !filters.query || card.search.includes(filters.query);
    const coverageMatch = filters.coverage === "any" || (filters.coverage === "paired") === filled(card.data);
    card.element.hidden = !(categoryMatch && queryMatch && coverageMatch);
    if (!card.element.hidden) shown += 1;
  }
  for (const [category, chip] of chips) {
    chip.setAttribute("aria-pressed", String(category === filters.category));
  }
  byId("results").textContent = "当前显示 " + shown + " / " + cases.length + " 条";
  byId("no-results").hidden = shown > 0;
}

function updateViewer() {
  const { title, photos, index } = viewerState;
  const item = photos[index];
  const caption = [item.side, item.label, item.panorama ? "全景图" : ""].filter(Boolean).join(" · ");
  byId("viewer-title").textContent = title;
  byId("viewer-error").hidden = true;
  const image = byId("viewer-image");
  image.hidden = false;
  image.alt = title + " · " + caption;
  image.src = item.src;
  byId("viewer-original").href = item.src;
  byId("viewer-caption").textContent = (index + 1) + " / " + photos.length + " · " + caption;
  byId("viewer-prev").disabled = index === 0;
  byId("viewer-next").disabled = index >= photos.length - 1;
}

function openViewer(title, photos, index, button) {
  viewerState = { title, photos, index, button };
  updateViewer();
  viewer.showModal();
}

function stepViewer(offset) {
  if (!viewerState) return;
  const next = viewerState.index + offset;
  if (next < 0 || next >= viewerState.photos.length) return;
  viewerState.index = next;
  updateViewer();
}

function makePanel(caseItem, side, photos, allPhotos, offset, note) {
  const panel = byId("panel-template").content.firstElementChild.cloneNode(true);
  panel.querySelector("h3").textContent = side;
  panel.querySelector(".panel-count").textContent = photos.length + " 张";
  if (photos.length === 0) {
    const empty = panel.querySelector(".empty-image");
    empty.hidden = false;
    empty.textContent = note || "暂未取得" + side;
    return panel;
  }
  for (const [index, item] of photos.entries()) {
    const figure = document.createElement("figure");
    const button = document.createElement("button");
    button.type = "button";
    button.className = "photo";
    button.dataset.panorama = String(item.panorama);
    const description = item.label || side + " " + (index + 1);
    button.setAttribute("aria-label", "放大查看 " + caseItem.title + " · " + description);
    const image = document.createElement("img");
    image.alt = caseItem.title + " · " + description;
    image.loading = "lazy";
    image.decoding = "async";
    image.addEventListener("error", () => {
      button.disabled = true;
      button.textContent = "图片文件无法读取";
    });
    image.src = item.src;
    button.append(image);
    button.addEventListener("click", () => openViewer(caseItem.title, allPhotos, offset + index, button));
    const label = [item.label, item.panorama ? "全景图" : ""].filter(Boolean).join(" · ");
    figure.append(button, textElement("figcaption", label));
    panel.querySelector(".images").append(figure);
  }
  if (note) {
    const status = panel.querySelector(".panel-note");
    status.hidden = false;
    status.textContent = note;
  }
  return panel;
}

function makeCard(caseItem, index) {
  const element = byId("case-template").content.firstElementChild.cloneNode(true);
  element.id = "case-" + caseItem.row_index;
  element.querySelector(".case-index").textContent = String(index + 1).padStart(2, "0");
  element.querySelector("h2").textContent = caseItem.title;
  element.querySelector(".case-category").textContent = caseItem.category;
  const photos = [
    ...caseItem.inputs.map((item) => ({ ...item, side: "输入图" })),
    ...caseItem.outputs.map((item) => ({ ...item, side: "输出图" })),
  ];
  element.querySelector(".pair").append(
    makePanel(caseItem, "输入图", caseItem.inputs, photos, 0, caseItem.input_status),
    makePanel(caseItem, "输出图", caseItem.outputs, photos, caseItem.inputs.length, caseItem.output_status)
  );
  const anchor = textElement("a", "案例 " + String(caseItem.row_index).padStart(2, "0"));
  anchor.href = "#" + element.id;
  const meta = element.querySelector(".case-meta");
  meta.append(anchor, textElement("span", "Task ID " + caseItem.task_id));
  return element;
}

byId("stat-total").textContent = cases.length;
byId("stat-inputs").textContent = cases.filter((item) => item.inputs.length > 0).length;
byId("stat-outputs").textContent = cases.filter((item) => item.outputs.length > 0).length;
byId("stat-paired").textContent = cases.filter(filled).length;
const fragment = document.createDocumentFragment();
for (const [index, caseItem] of cases.entries()) {
  categoryCounts.set(caseItem.category, (categoryCounts.get(caseItem.category) || 0) + 1);
  const element = makeCard(caseItem, index);
  const search = [caseItem.title, caseItem.category, String(caseItem.row_index), caseItem.task_id].join(" ").toLowerCase();
  cards.push({ data: caseItem, element, search });
  fragment.append(element);
}
byId("cases").append(fragment);
addChip("", "全部", cases.length);
for (const [category, count] of categoryCounts) addChip(category, category, count);

document.querySelector(".toolbar").addEventListener("submit", (event) => event.preventDefault());
byId("search").addEventListener("input", (event) => {
  filters.query = event.target.value.trim().toLowerCase();
  updateFilters();
});
byId("coverage").addEventListener("change", (event) => {
  filters.coverage = event.target.value;
  updateFilters();
});
byId("viewer-close").addEventListener("click", () => viewer.close());
byId("viewer-prev").addEventListener("click", () => stepViewer(-1));
byId("viewer-next").addEventListener("click", () => stepViewer(1));
byId("viewer-image").addEventListener("error", (event) => {
  event.target.hidden = true;
  byId("viewer-error").hidden = false;
});
viewer.addEventListener("click", (event) => {
  if (event.target === viewer) viewer.close();
});
viewer.addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft") stepViewer(-1);
  if (event.key === "ArrowRight") stepViewer(1);
});
viewer.addEventListener("close", () => {
  byId("viewer-image").removeAttribute("src");
  viewerState?.button.focus();
  viewerState = undefined;
});
updateFilters();
if (location.hash) byId(location.hash.slice(1))?.scrollIntoView();
</script>
